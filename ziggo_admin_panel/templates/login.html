<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ziggo Admin · Sign in</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ziggo: {
                            DEFAULT: '#1E40AF',
                            dark: '#172554',
                            light: '#3B82F6',
                            soft: '#DBEAFE',
                            accent: '#FBBF24',
                            ink: '#0F172A',
                            muted: '#64748B',
                            faint: '#94A3B8',
                            canvas: '#F5F7FB',
                            line: '#EEF1F6'
                        }
                    },
                    fontFamily: { sans: ['Sora', 'sans-serif'] },
                    boxShadow: {
                        'soft': '0 24px 60px -20px rgba(15, 23, 42, 0.14), 0 4px 10px -3px rgba(15, 23, 42, 0.04)',
                        'brand': '0 16px 40px -12px rgba(30, 64, 175, 0.45)'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Sora', sans-serif; color: #E2E8F0;
            background:
                radial-gradient(1000px 560px at 50% -10%, #1E3A8A 0%, rgba(30,58,138,0) 55%),
                linear-gradient(160deg, #0A0F22 0%, #0E1530 55%, #101A3A 100%);
        }
        .ambient-orb {
            position: absolute;
            border-radius: 9999px;
            filter: blur(85px);
            opacity: 0.55;
            pointer-events: none;
        }
        .glass {
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.12);
        }
        input.brand-field {
            transition: all 0.18s ease;
            background: rgba(255,255,255,0.05);
            border: 1.5px solid rgba(255,255,255,0.10);
            color: #fff;
        }
        input.brand-field::placeholder { color: #64748B; }
        input.brand-field:hover { background: rgba(255,255,255,0.08); }
        input.brand-field:focus {
            outline: none;
            background: rgba(255,255,255,0.10);
            border-color: #3B82F6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.22);
        }
        @keyframes cardIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
        .card-in { animation: cardIn .5s cubic-bezier(.22,.61,.36,1) both; }
    </style>
</head>
<body class="min-h-screen relative overflow-hidden">

    <!-- Ambient brand glows -->
    <div class="ambient-orb" style="background:#3B82F6; width:480px; height:480px; top:-180px; left:-140px;"></div>
    <div class="ambient-orb" style="background:#1E40AF; width:420px; height:420px; bottom:-180px; right:-120px; opacity:.4;"></div>
    <div class="ambient-orb" style="background:#6366F1; width:300px; height:300px; top:30%; right:-120px; opacity:.25;"></div>

    <div class="relative min-h-screen flex items-center justify-center p-6">
        <div class="w-full max-w-md card-in">

            <!-- Brand -->
            <div class="flex flex-col items-center mb-8">
                <div class="w-20 h-20 rounded-2xl overflow-hidden mb-4 flex items-center justify-center" style="background: #fff; padding: 6px; box-shadow: 0 18px 50px -12px rgba(59,130,246,0.6), inset 0 0 0 1px rgba(255,255,255,0.2);">
                    <img src="/static/img/logo.jpeg" alt="Ziggo" class="w-full h-full object-cover rounded-2xl">
                </div>
                <p class="text-[10px] uppercase tracking-[0.32em] font-bold text-blue-300/80">Welcome back to</p>
                <h1 class="text-3xl font-extrabold text-white tracking-tight mt-1.5">Ziggo</h1>
                <p class="text-sm text-slate-400 mt-2">Sign in to manage rides, drivers and more.</p>
            </div>

            <!-- Card -->
            <div class="glass rounded-3xl p-8 relative overflow-hidden"
                 style="box-shadow: 0 40px 90px -30px rgba(0,0,0,0.65), 0 0 60px -20px rgba(59,130,246,0.35), inset 0 1px 0 rgba(255,255,255,0.15);">
                <div class="absolute top-0 inset-x-0 h-1" style="background:linear-gradient(90deg,#1E40AF,#3B82F6,#60A5FA,#1E40AF);"></div>

                {% if error %}
                <div class="mb-5 p-3 rounded-2xl bg-red-500/15 border border-red-400/30 text-red-300 text-sm font-semibold flex items-center gap-2">
                    <i class="fas fa-circle-exclamation"></i>
                    <span>{{ error }}</span>
                </div>
                {% endif %}

                <form action="/admin/login" method="POST" class="space-y-5">

                    <div>
                        <label for="phone_number" class="block text-[11px] font-black tracking-[0.18em] text-slate-400 uppercase mb-2">Phone number</label>
                        <div class="relative">
                            <i class="fas fa-phone absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
                            <input type="tel" name="phone_number" id="phone_number"
                                   class="brand-field w-full pl-11 pr-4 py-4 rounded-2xl text-sm font-semibold"
                                   required value="0700000000" maxlength="10" minlength="10" pattern="\d{10}">
                        </div>
                    </div>

                    <div>
                        <label for="password" class="block text-[11px] font-black tracking-[0.18em] text-slate-400 uppercase mb-2">Password</label>
                        <div class="relative">
                            <i class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
                            <input type="password" name="password" id="password"
                                   class="brand-field w-full pl-11 pr-11 py-4 rounded-2xl text-sm font-semibold"
                                   placeholder="••••••••" required value="admin123">
                            <button type="button" id="togglePw" tabindex="-1" aria-label="Show password"
                                    class="absolute right-3 top-1/2 -translate-y-1/2 w-8 h-8 flex items-center justify-center rounded-lg text-slate-500 hover:text-white hover:bg-white/10 transition">
                                <i class="fas fa-eye text-sm"></i>
                            </button>
                        </div>
                    </div>

                    <div class="flex items-center justify-between pt-1">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input id="remember-me" name="remember-me" type="checkbox" class="w-4 h-4 rounded bg-white/10 border-white/20 text-ziggo-light focus:ring-ziggo-light">
                            <span class="text-sm font-semibold text-slate-300">Remember me</span>
                        </label>
                    </div>

                    <button type="submit"
                            class="group w-full py-4 rounded-2xl text-sm font-black tracking-wide text-white transition-all duration-200 active:scale-[0.98] hover:brightness-110"
                            style="background: linear-gradient(135deg, #1E40AF 0%, #3B82F6 100%); box-shadow: 0 18px 40px -12px rgba(59,130,246,0.6);">
                        SIGN IN <i class="fas fa-arrow-right ml-1 transition-transform group-hover:translate-x-1"></i>
                    </button>
                </form>
            </div>

            <p class="text-center text-[11px] text-slate-500 mt-6 font-semibold">
                © Ziggo · Internal use only
            </p>
        </div>
    </div>

    <script>
        (function () {
            var btn = document.getElementById('togglePw');
            var pw = document.getElementById('password');
            if (btn && pw) {
                btn.addEventListener('click', function () {
                    var show = pw.type === 'password';
                    pw.type = show ? 'text' : 'password';
                    btn.querySelector('i').className = (show ? 'fas fa-eye-slash' : 'fas fa-eye') + ' text-sm';
                    btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
                });
            }
        })();
    </script>
</body>
</html>
