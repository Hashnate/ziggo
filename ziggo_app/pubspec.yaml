name: ziggo_app
description: Complete Ride & Delivery Platform
publish_to: 'none'
version: 1.0.0+10

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Map — Google Maps SDK (Places + Directions called via dio)
  google_maps_flutter: ^2.9.0
  latlong2: ^0.9.1

  # State + storage
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # Networking + realtime
  dio: ^5.4.0
  web_socket_channel: ^3.0.1

  # Location (uses OS GPS, not Google APIs)
  geolocator: ^13.0.1

  # UX polish
  animated_text_kit: ^4.2.2
  shimmer: ^3.0.0
  google_fonts: ^6.1.0
  intl: ^0.19.0
  url_launcher: ^6.3.2
  image_picker: ^1.1.2

  # Secrets at runtime — reads ziggo_app/.env (gitignored). No keys in source.
  flutter_dotenv: ^5.1.0

  # Firebase Cloud Messaging — push notifications. Requires
  # android/app/google-services.json + ios/Runner/GoogleService-Info.plist
  # (both gitignored). When the config files are missing, init throws and
  # the FcmService catches → app keeps working, just no pushes.
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # Show notifications + play sound when an FCM push arrives while the app
  # is in the FOREGROUND. Android doesn't auto-show foreground pushes, and
  # the firebase_messaging plugin alone has no API to display one — this
  # plugin fills that gap. It also lets us pre-create the high-importance
  # ride-alert channel that pins our custom sound.
  flutter_local_notifications: ^17.2.3

  # PayHere hosted checkout — opened in an in-app WebView. Returns to the
  # app via PayHere's `return_url` (a deep link we control).
  webview_flutter: ^4.10.0

  # QR Scanning & Generation for Scan-to-Pay
  mobile_scanner: ^6.0.0
  qr_flutter: ^4.1.0

  # In-app alert sound. The driver's new-ride alert is played IN-APP (looping)
  # the moment the request sheet appears, so it does NOT depend on the FCM
  # notification firing / notification permission being granted — those only
  # cover the backgrounded/killed case. Asset: assets/sounds/ride_alert.mp3.
  audioplayers: ^6.1.0
  flutter_contacts: ^2.1.0
  pdf: ^3.12.0
  printing: ^5.14.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon_fixed.png"
  adaptive_icon_background: "#051347"
  adaptive_icon_foreground: "assets/images/app_icon_fixed.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/marketplace/
    - assets/icons/
    - assets/sounds/
    - .env
