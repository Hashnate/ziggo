name: ziggo_app
description: Complete Ride & Delivery Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Map — Google Maps SDK (Places + Directions called via dio)
  google_maps_flutter: ^2.9.0
  latlong2: ^0.9.1

  # State + storage
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # Networking + realtime
  dio: ^5.4.0
  web_socket_channel: ^3.0.1

  # Location (uses OS GPS, not Google APIs)
  geolocator: ^13.0.1

  # UX polish
  animated_text_kit: ^4.2.2
  shimmer: ^3.0.0
  google_fonts: ^6.1.0
  intl: ^0.19.0
  url_launcher: ^6.3.2
  image_picker: ^1.1.2

  # Secrets at runtime — reads ziggo_app/.env (gitignored). No keys in source.
  flutter_dotenv: ^5.1.0


  # Push notifications — Firebase Cloud Messaging + local notification display.
  # Requires google-services.json (Android) + GoogleService-Info.plist (iOS).

  # Payments — PayHere native SDK (SL card + wallet gateway).
  payhere_mobilesdk_flutter: ^3.0.5

  # Push notifications — Firebase Cloud Messaging + local notification display.
  # Requires google-services.json (Android) + GoogleService-Info.plist (iOS).
  # Until those are added, FcmService.init() catches the init error and
  # falls back to a no-op so the app still boots.

  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - .env
