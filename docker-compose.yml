# Ziggo — production docker-compose for shared-host deployment.
#
# Two containers on an internal-only network:
#   - ziggo_postgres : Postgres 16, NOT exposed to the host (only ziggo_backend reaches it)
#   - ziggo_backend  : FastAPI + uvicorn, exposed on host port ${ZIGGO_PORT:-8030}
#
# The host nginx reverse-proxies a domain (e.g. ziggo.example.com or
# example.com/ziggo) to 127.0.0.1:${ZIGGO_PORT}.
#
# Persistence:
#   ziggo_pgdata     : Postgres data dir
#   ziggo_uploads    : admin panel uploads (driver photos etc.) — survive rebuilds
#
# Bring up:
#   cd /var/www/ziggo
#   cp ziggo_backend/.env.production.example .env
#   # edit .env: set SECRET_KEY, POSTGRES_PASSWORD
#   docker compose up -d --build
#
# Logs:    docker compose logs -f ziggo_backend
# Shell:   docker compose exec ziggo_backend bash
# DB:      docker compose exec ziggo_postgres psql -U ziggo -d ziggo
# Stop:    docker compose down       (keeps volumes)
# Nuke:    docker compose down -v    (deletes volumes — destroys data!)

services:
  ziggo_postgres:
    image: postgres:16-alpine
    container_name: ziggo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ziggo}
      POSTGRES_USER: ${POSTGRES_USER:-ziggo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - ziggo_pgdata:/var/lib/postgresql/data
    networks:
      - ziggo_net
    # No `ports:` block — Postgres is only reachable from the backend container.
    # If you want to connect from the host (psql / pgAdmin), uncomment AND pick
    # a port that doesn't clash with the host MariaDB on 3306:
    # ports:
    #   - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ziggo} -d ${POSTGRES_DB:-ziggo}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  ziggo_backend:
    build:
      # Build context is the repo root so the image can include both
      # ziggo_backend/ (the API) and ziggo_admin_panel/ (the web UI sibling).
      context: .
      dockerfile: ziggo_backend/Dockerfile
    container_name: ziggo_backend
    restart: unless-stopped
    depends_on:
      ziggo_postgres:
        condition: service_healthy
    environment:
      # Async URL the FastAPI app uses (asyncpg driver)
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ziggo}:${POSTGRES_PASSWORD}@ziggo_postgres:5432/${POSTGRES_DB:-ziggo}
      # Sync URL for alembic / one-off scripts (psycopg driver)
      SYNC_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ziggo}:${POSTGRES_PASSWORD}@ziggo_postgres:5432/${POSTGRES_DB:-ziggo}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in .env}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-11520}
      DEV_MODE: ${DEV_MODE:-false}
      PROJECT_NAME: ${PROJECT_NAME:-Ziggo}
      API_V1_STR: ${API_V1_STR:-/api/v1}
      # 3rd-party API keys. All optional — empty values disable each
      # integration and the app falls back to its stub behaviour.
      FIREBASE_CREDENTIALS_PATH: ${FIREBASE_CREDENTIALS_PATH:-}
      NOTIFY_LK_USER_ID: ${NOTIFY_LK_USER_ID:-}
      NOTIFY_LK_API_KEY: ${NOTIFY_LK_API_KEY:-}
      NOTIFY_LK_SENDER_ID: ${NOTIFY_LK_SENDER_ID:-}
      PAYHERE_MERCHANT_ID: ${PAYHERE_MERCHANT_ID:-}
      PAYHERE_MERCHANT_SECRET: ${PAYHERE_MERCHANT_SECRET:-}
      PAYHERE_APP_ID: ${PAYHERE_APP_ID:-}
      PAYHERE_APP_SECRET: ${PAYHERE_APP_SECRET:-}
      PAYHERE_MODE: ${PAYHERE_MODE:-sandbox}
      PAYHERE_NOTIFY_URL: ${PAYHERE_NOTIFY_URL:-}
      # Legacy stubs (kept for backwards compatibility; safe to delete):
      # TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      # TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      # TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
      # STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      # GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
    volumes:
      # Persist admin panel uploads (driver photos etc.) across container
      # rebuilds. The named volume's contents survive the path change so
      # existing uploads keep working after the admin_panel move.
      - ziggo_uploads:/app/ziggo_admin_panel/static/uploads
    ports:
      # Public binding — accepts traffic from outside the server on
      # ${ZIGGO_PORT}. Switch back to "127.0.0.1:..." once nginx is fronting
      # this so the backend isn't directly reachable from the internet.
      - "0.0.0.0:${ZIGGO_PORT:-8030}:8000"
    networks:
      - ziggo_net

networks:
  ziggo_net:
    driver: bridge

volumes:
  ziggo_pgdata:
  ziggo_uploads: 