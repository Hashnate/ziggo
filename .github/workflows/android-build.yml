name: Android Release Build (APK & AAB)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'ziggo_app/**'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    name: Build Android APK and AAB
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ziggo_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Configure keystore signing and properties
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          # 1. Decode keystore file from repository secrets into android/app/
          # Using -di to ignore newlines, whitespace, and carriage returns that may have been pasted into the secret.
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -di > android/app/upload-keystore.jks
          
          # Print size of the keystore to help verify it decoded correctly (should be >0 bytes)
          echo "Decoded Keystore size:"
          ls -lh android/app/upload-keystore.jks
          
          # 2. Write key.properties for Gradle release signing config
          echo "storePassword=$ANDROID_STORE_PASSWORD" > android/key.properties
          echo "keyPassword=$ANDROID_KEY_PASSWORD" >> android/key.properties
          echo "keyAlias=$ANDROID_KEY_ALIAS" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties

          # 3. Write local.properties for the Maps API key gradle manifest placeholder
          echo "MAPS_API_KEY=$MAPS_API_KEY" > android/local.properties

          # 4. Write Dart runtime .env
          echo "GOOGLE_MAPS_API_KEY=$MAPS_API_KEY" > .env

          # 5. Inject google-services.json for Firebase
          echo "${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > android/app/google-services.json

      - name: Build Android App Bundle (AAB)
        run: flutter build appbundle --release

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload Android App Bundle (AAB) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: ziggo_app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: ziggo_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
