name: iOS TestFlight Build and Upload

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'ziggo_app/**'
      - '.github/workflows/ios-testflight.yml'

jobs:
  build-and-upload:
    name: Build IPA and Upload to TestFlight
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ziggo_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          flutter build ios --config-only --no-codesign
          cd ios && pod install

      - name: Install Apple Certificate and Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          export CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          export PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          export KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH login.keychain

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

      - name: Compute build number
        run: echo "BUILD_NUMBER=$(( ${{ github.run_number }} + 100 ))" >> "$GITHUB_ENV"

      - name: Build and export signed IPA
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          # Inject the Google Maps key (single key for Android/iOS/web) from the
          # MAPS_API_KEY repo secret. .env carries it for Dart/web; Secrets.xcconfig
          # feeds GMSServices.provideAPIKey so the iOS map view doesn't crash.
          printf 'GOOGLE_MAPS_API_KEY=%s\n' "$MAPS_API_KEY" > .env
          printf 'MAPS_API_KEY=%s\n' "$MAPS_API_KEY" > ios/Flutter/Secrets.xcconfig

          # Inject GoogleService-Info.plist for Firebase Cloud Messaging using a temp file to avoid python string literal escaping/newline issues
          echo "${{ secrets.IOS_GOOGLE_SERVICE_INFO_BASE64 }}" > ios_base64_temp.txt
          python3 -c "import base64; open('ios/Runner/GoogleService-Info.plist', 'wb').write(base64.b64decode(open('ios_base64_temp.txt', 'r').read().strip()))"
          rm ios_base64_temp.txt

          # Archive unsigned, then sign at export time from ExportOptions.plist.
          flutter build ipa --release --no-codesign --build-number="$BUILD_NUMBER"

          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist ios/ExportOptions.plist

          mv build/ios/ipa/*.ipa build/ios/ipa/app.ipa

      - name: Upload app to TestFlight
        uses: apple-actions/upload-testflight-build@v3
        with:
          app-path: ziggo_app/build/ios/ipa/app.ipa
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Clean up keychain and provisioning profile
        if: ${{ always() }}
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/build_pp.mobileprovision || true
