name: iOS TestFlight Build and Upload

on:
  push:
    branches:
      - main
    paths:
      - 'ziggo_app/**'
      - '.github/workflows/ios-testflight.yml'

jobs:
  build-and-upload:
    name: Build IPA and Upload to TestFlight
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ziggo_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          flutter build ios --config-only --no-codesign
          cd ios && pod install

      - name: Install Apple Certificate and Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          export CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          export PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          export KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH login.keychain

          echo "=== Provisioning Profile Info ==="
          security cms -D -i $PP_PATH | grep -A 10 -i "DeveloperCertificates" || true
          security cms -D -i $PP_PATH | grep -A 12 -i "Entitlements" || true
          security cms -D -i $PP_PATH | grep -A 5 -i "UUID" || true
          security cms -D -i $PP_PATH | grep -A 5 -i "Name" || true
          echo "================================="

          echo "=== Certificate Comparison ==="
          cat << 'EOF' | sed 's/^          //' > $RUNNER_TEMP/compare_certs.py
          import os
          import base64
          from cryptography import x509
          from cryptography.hazmat.backends import default_backend
          from cryptography.hazmat.primitives import hashes
          import plistlib
          import subprocess

          cert_path = os.environ['CERTIFICATE_PATH']
          p12_password = os.environ['P12_PASSWORD']
          pp_path = os.environ['PP_PATH']

          # Read certificate from P12
          print('Loading P12 certificate...')
          cert_pem = subprocess.check_output([
              'openssl', 'pkcs12', '-in', cert_path, '-nokeys', '-clcerts', '-passin', f'pass:{p12_password}'
          ])
          imported_cert = x509.load_pem_x509_certificate(cert_pem, default_backend())
          imported_sha1 = imported_cert.fingerprint(hashes.SHA1()).hex()
          print(f'Imported P12 Certificate SHA-1: {imported_sha1}')
          print(f'Imported P12 Certificate Serial: {imported_cert.serial_number}')

          # Read certificate from Provisioning Profile
          print('Loading Provisioning Profile certificate...')
          pp_plist_data = subprocess.check_output(['security', 'cms', '-D', '-i', pp_path])
          pp_plist = plistlib.loads(pp_plist_data)
          for idx, cert_bytes in enumerate(pp_plist.get('DeveloperCertificates', [])):
              cert = x509.load_der_x509_certificate(cert_bytes, default_backend())
              sha1 = cert.fingerprint(hashes.SHA1()).hex()
              print(f'Profile Cert #{idx} SHA-1: {sha1}')
              print(f'Profile Cert #{idx} Serial: {cert.serial_number}')
          EOF
          python3 $RUNNER_TEMP/compare_certs.py || echo "Note: Python comparison failed (cryptography library might not be installed, but it was worth a shot)"
          echo "==============================="

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

      - name: Build Flutter IPA
        run: flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      - name: Upload app to TestFlight
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: ziggo_app/build/ios/ipa/*.ipa
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Clean up keychain and provisioning profile
        if: ${{ always() }}
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/build_pp.mobileprovision || true
